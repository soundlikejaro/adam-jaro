<!DOCTYPE html>
<html lang="en" class="">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{meta_title}}</title>
    <meta name="description" content="{{meta_description}}">
    {{canonical}}
    {{meta_robots}}
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">

    <!-- Open Graph -->
    <meta property="og:type" content="{{meta_type}}">
    <meta property="og:site_name" content="Adam Jaro">
    <meta property="og:locale" content="en_GB">
    <meta property="og:url" content="{{meta_url}}">
    <meta property="og:title" content="{{meta_title}}">
    <meta property="og:description" content="{{meta_description}}">
    <meta property="og:image" content="{{meta_image}}">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="{{meta_image_alt}}">

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="{{meta_title}}">
    <meta name="twitter:description" content="{{meta_description}}">
    <meta name="twitter:image" content="{{meta_image}}">

    <!-- No-Flash Theme Script -->
    <script>
        try {
            if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark');
            }
        } catch (e) {}
    </script>

    {{site_config}}

    <!-- Fonts: one variable file per family covers every weight used -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400..700&family=Space+Grotesk:wght@300..700&display=swap"
        rel="stylesheet">

    <!-- Styles are compiled at build time (Tailwind + src/style.css) -->
    <link rel="stylesheet" href="/style.css?v={{css_version}}">
    {{structured_data}}
</head>

<body class="min-h-screen flex flex-col">
    <!-- Header -->
    <header id="main-header"
        class="fixed top-0 left-0 w-full flex justify-between items-center px-4 md:px-10 py-4 md:py-6 z-50 transition-all duration-300">
        <a href="/"
            class="text-2xl font-bold tracking-tight cursor-pointer nav-link hover:opacity-70 transition-opacity"
            id="nav-home">ADAM JARO </a>
        <nav class="flex items-center gap-6"><a href="/info/"
                class="text-lg font-medium tracking-wide cursor-pointer nav-link hover:opacity-70 transition-opacity"
                id="nav-info">INFO</a></nav>
    </header>
    <!-- Main Content Area -->
    <main id="main-content" class="flex-grow px-4 md:px-10 pt-24 md:pt-32 pb-40 md:pb-48">
        {{content}}
    </main>
    <!-- Global Footer -->
    <footer
        class="fixed bottom-0 left-0 w-full bg-white/60 dark:bg-[#111111]/60 backdrop-blur-md p-4 md:p-6 border-t border-border-light transition-colors duration-300 z-40">
        <div class="max-w-6xl mx-auto flex flex-col md:flex-row justify-between items-center text-center md:text-left">
            <div class="mb-2 md:mb-0"><a id="footer-email-link"
                    class="text-base nav-link font-medium hover:underline"></a>
                <p class="text-xs text-muted-text mt-1">© <span id="footer-year"></span> Adam Jaro. Creative
                    Direction. <a href="/privacy/" class="underline hover:text-primary-text">Privacy</a></p>
            </div>
            <div class="flex items-center space-x-6">
                <div id="footer-social-links" class="flex space-x-4">
                    {{footer_social}}
                </div><button id="theme-toggle" type="button"
                    class="p-2 rounded-full text-muted-text hover:text-primary-text hover:bg-border-light transition-colors focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary-text"><span
                        class="sr-only">Toggle dark mode</span><svg id="sun-icon" class="h-5 w-5" fill="none"
                        viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
                    </svg><svg id="moon-icon" class="h-5 w-5 hidden" fill="none" viewBox="0 0 24 24"
                        stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
                    </svg></button>
            </div>
        </div>
    </footer>
    <!-- Main Script -->
    <script type="module" src="/script.js?v={{js_version}}"></script>
</body>

</html>
